services:
  postgres:
    image: postgres:16-alpine
    container_name: usagepanel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: usagepanel
      POSTGRES_USER: usagepanel
      POSTGRES_PASSWORD: change_this_database_password
    ports:
      - "5432:5432"
    volumes:
      - usagepanel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usagepanel -d usagepanel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  usagepanel_postgres_data:
